name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=json --outputFile=test-results.json
      - run: npm run lint:css
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Windows'
        run: npm run test:windows:app -- "release/win-unpacked/Iliad MD.exe"
      - if: runner.os == 'Windows'
        run: ./scripts/verifyWindowsInstaller.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Get-FileHash release/*.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256SUMS.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}-${{ github.sha }}
          retention-days: 7
          path: |
            test-results.json
            test-artifacts/**/report.json
            test-artifacts/**/failure.png
            release/*.exe
            release/SHA256SUMS.txt
